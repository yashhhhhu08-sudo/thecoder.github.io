            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #173d32;
        }

        .recipe-container {
            display: grid;
            grid-template-columns: repeat(3, 190px);
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .recipe-box {
            width: 190px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 2px 5px #ccc;
        }

        .recipe-box img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .recipe-box h3 {
            margin: 10px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
