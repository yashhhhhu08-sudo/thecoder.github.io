<html>
<head>
	<title>circle</title>
<style>
	div{
		width: 100px;
		height: 100px;
		border-radius:200px ;
		background-color: darkred;
		position: relative;
		animation-name: example;
		animation-duration:10s;
	}
	@keyFrames example{
		0%{left: 0px;top: 0px;}
		25%{left: 0px;top: 500px;}
		50%{left: 0px;top: 0px;}
		75%{left: 0px;top: 500px;}
		100%{left: 0px;top: 0px;}
	}
</style>
</head>
<body>
	<h1 align="center">bouncing of the circel</h1>
	<div></div>
</body>
</html>
